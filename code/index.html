<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz app</title>
  <link rel="stylesheet" href="./styles/quiz.css">
  <link rel="icon" href="../assets/images/Quiz-icon.png">
  <script src="./scripts/quiz.js" type="module"></script>
</head>
<body>
  <div class="quiz-container">
    <section class="head-section">
      <div class="quiz-meta">
        <span class="question-number">Question 1 of 10</span>
      </div>
      <h2 class="question">The question goes here</h2>
    </section>
    <section class="option-section">
    </section>
    <section class="footer-section">
      <button class="next">Next</button>
      <button class="submit hidden">Submit</button>
      <button class="previous">Previous</button>
    </section>
  </div>

</body>
</html>
